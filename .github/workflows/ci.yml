name: CI

# Runs on every push and pull request. Validates the frontend (typecheck,
# build) and Yandex Cloud functions (TypeScript check + bundle). The
# deploy job lives in deploy.yml and runs only on pushes to main.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build production bundle
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Verify build output
        run: |
          test -f dist/index.html
          test -f dist/play.html
          test -f dist/__quiz_engine.js
          test -f dist/assets/__quiz_engine.js
          test -f dist/assets/__quiz_template_runner.js

  edge-functions:
    name: Yandex Functions (typecheck + bundle)
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: yc-functions/package-lock.json

      - name: Install function dependencies
        working-directory: yc-functions
        run: npm ci

      - name: Type-check all Yandex functions
        working-directory: yc-functions
        run: npm run lint

      - name: Bundle all Yandex functions
        working-directory: yc-functions
        run: npm run build
