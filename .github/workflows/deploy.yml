name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: yc-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.deploy_functions != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YC_CDN_RESOURCE_ID: ${{ secrets.YC_CDN_RESOURCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Type-check Yandex functions
        run: npm run lint:functions

      - name: Bundle Yandex functions
        run: npm run test:functions

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: npm run build

      - name: Configure AWS credentials for Yandex Object Storage
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          aws-region: ru-central1

      - name: Sync immutable hashed assets to Yandex Object Storage
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync ./dist/assets s3://${{ secrets.YC_BUCKET }}/assets \
            --delete \
            --cache-control "public, max-age=31536000, immutable"

      - name: Upload immutable root assets to Yandex Object Storage
        run: |
          find ./dist -maxdepth 1 -type f \( \
            -name "*.js" -o \
            -name "*.css" -o \
            -name "*.woff" -o \
            -name "*.woff2" -o \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.svg" -o \
            -name "*.webp" -o \
            -name "*.ico" \
          \) -print0 | while IFS= read -r -d '' file; do
            aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$file" "s3://${{ secrets.YC_BUCKET }}/$(basename "$file")" \
              --cache-control "public, max-age=31536000, immutable"
          done

      - name: Upload HTML and root files to Yandex Object Storage
        run: |
          find ./dist -maxdepth 1 -type f ! \( \
            -name "*.js" -o \
            -name "*.css" -o \
            -name "*.woff" -o \
            -name "*.woff2" -o \
            -name "*.png" -o \
            -name "*.jpg" -o \
            -name "*.jpeg" -o \
            -name "*.svg" -o \
            -name "*.webp" -o \
            -name "*.ico" \
          \) -print0 | while IFS= read -r -d '' file; do
            aws --endpoint-url=https://storage.yandexcloud.net s3 cp "$file" "s3://${{ secrets.YC_BUCKET }}/$(basename "$file")" \
              --cache-control "public, max-age=0, must-revalidate"
          done

      - name: Apply website configuration
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3api put-bucket-website \
            --bucket ${{ secrets.YC_BUCKET }} \
            --website-configuration file://deploy/yandex-cloud/website-config.json

      - name: Apply CORS configuration
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3api put-bucket-cors \
            --bucket ${{ secrets.YC_BUCKET }} \
            --cors-configuration file://deploy/yandex-cloud/cors-config.json

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yandex-cloud -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Purge Yandex CDN cache
        if: ${{ env.YC_CDN_RESOURCE_ID != '' }}
        env:
          YC_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_CDN_RESOURCE_ID: ${{ secrets.YC_CDN_RESOURCE_ID }}
        run: |
          yc cdn cache purge --resource-id "$YC_CDN_RESOURCE_ID" --path '/*'

  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_functions == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: yc-functions/package-lock.json

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yandex-cloud -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure yc CLI
        env:
          YC_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          yc config set token "$YC_TOKEN"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Install dependencies
        working-directory: yc-functions
        run: npm ci

      - name: Build unified API router
        working-directory: yc-functions
        run: npm run build:router

      - name: Deploy unified API function
        working-directory: yc-functions
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          set -euo pipefail
          LOCKBOX_SECRET_ID=$(yc lockbox secret list --folder-id "$YC_FOLDER_ID" --format json | jq -r '.[] | select(.name == "potok-secrets") | .id')
          SA_ID=$(yc iam service-account list --folder-id "$YC_FOLDER_ID" --format json | jq -r '.[] | select(.name == "quizflow-functions") | .id')
          test -n "$LOCKBOX_SECRET_ID"
          test -n "$SA_ID"

          ZIP_FILE="/tmp/api-router.zip"
          rm -f "$ZIP_FILE"
          (cd dist/api-router && zip -r "$ZIP_FILE" .)

          SECRETS=(
            PG_HOST PG_PORT PG_DATABASE PG_USER PG_PASSWORD PG_CA_CERT
            SUPABASE_URL SUPABASE_ANON_KEY
            YC_ACCESS_KEY_ID YC_SECRET_ACCESS_KEY S3_BUCKET
            YOOKASSA_SHOP_ID YOOKASSA_SECRET_KEY
            FRONTEND_URL ALLOWED_ORIGINS
            BILLING_WEBHOOK_SECRET BILLING_ADMIN_SECRET
            OPENROUTER_API_KEY AI_PROXY_ALLOWED_MODELS AI_PROXY_DEFAULT_MODEL
            AI_PROXY_MAX_TOKENS AI_PROXY_MAX_PROMPT_CHARS AI_PROXY_REFERER
            YC_CATALOG_ID YC_OAUTH_TOKEN
          )

          SECRET_FLAGS=()
          for SECRET_KEY in "${SECRETS[@]}"; do
            SECRET_FLAGS+=(--secret "environment-variable=$SECRET_KEY,name=$LOCKBOX_SECRET_ID,key=$SECRET_KEY")
          done

          yc serverless function version create \
            --function-name potok-api-quizzes \
            --runtime nodejs18 \
            --entrypoint index.handler \
            --memory 512m \
            --execution-timeout 60s \
            --service-account-id "$SA_ID" \
            --source-path "$ZIP_FILE" \
            "${SECRET_FLAGS[@]}"
