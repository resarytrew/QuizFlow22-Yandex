name: Deploy to Yandex Cloud

on:
  push:
    branches: [main]
  schedule:
    # Refresh prerendered public scenarios and sitemap every night (05:15 MSK).
    - cron: '15 2 * * *'
  workflow_dispatch:
    inputs:
      deploy_functions:
        description: 'Deploy Cloud Functions'
        required: false
        default: 'false'
        type: boolean

concurrency:
  group: yc-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      YC_CDN_RESOURCE_ID: ${{ secrets.YC_CDN_RESOURCE_ID }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run lint

      - name: Run frontend unit tests
        run: npm test

      - name: Build production bundle
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_YANDEX_METRIKA_ID: ${{ vars.VITE_YANDEX_METRIKA_ID }}
        run: npm run build

      - name: Configure AWS credentials for Yandex Object Storage
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.YC_S3_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.YC_S3_SECRET_ACCESS_KEY }}
          aws-region: ru-central1

      - name: Sync immutable hashed assets to Yandex Object Storage
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync ./dist s3://${{ secrets.YC_BUCKET }} \
            --delete \
            --exclude "*" \
            --include "assets/*" \
            --cache-control "public, max-age=31536000, immutable"

      - name: Sync HTML and root files (no-cache)
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3 sync ./dist s3://${{ secrets.YC_BUCKET }} \
            --delete \
            --exclude "assets/*" \
            --cache-control "public, max-age=0, must-revalidate"

      - name: Apply website configuration
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3api put-bucket-website \
            --bucket ${{ secrets.YC_BUCKET }} \
            --website-configuration file://deploy/yandex-cloud/website-config.json

      - name: Apply CORS configuration
        run: |
          aws --endpoint-url=https://storage.yandexcloud.net s3api put-bucket-cors \
            --bucket ${{ secrets.YC_BUCKET }} \
            --cors-configuration file://deploy/yandex-cloud/cors-config.json

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yandex-cloud -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Purge Yandex CDN cache
        if: ${{ env.YC_CDN_RESOURCE_ID != '' }}
        env:
          YC_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_CDN_RESOURCE_ID: ${{ secrets.YC_CDN_RESOURCE_ID }}
        run: |
          yc cdn cache purge --resource-id "$YC_CDN_RESOURCE_ID" --path '/*'

      - name: Notify IndexNow about deployed SEO pages
        run: node scripts/submit-indexnow.mjs

  deploy-functions:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: build-and-deploy
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.deploy_functions == 'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: yc-functions/package-lock.json

      - name: Install Yandex Cloud CLI
        run: |
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i $HOME/yandex-cloud -n
          echo "$HOME/yandex-cloud/bin" >> $GITHUB_PATH

      - name: Configure yc CLI
        env:
          YC_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
          YC_CLOUD_ID: ${{ secrets.YC_CLOUD_ID }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          yc config set token "$YC_TOKEN"
          yc config set cloud-id "$YC_CLOUD_ID"
          yc config set folder-id "$YC_FOLDER_ID"

      - name: Install dependencies
        working-directory: yc-functions
        run: npm ci

      - name: Build all functions
        working-directory: yc-functions
        run: npm run build

      - name: Deploy Cloud Functions
        working-directory: yc-functions
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          YC_OAUTH_TOKEN: ${{ secrets.YC_OAUTH_TOKEN }}
        run: |
          chmod +x deploy/deploy-functions.sh
          ./deploy/deploy-functions.sh

      - name: Deploy API Gateway
        working-directory: yc-functions
        env:
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
        run: |
          chmod +x deploy/deploy-gateway.sh
          ./deploy/deploy-gateway.sh
