name: Verify release
on:
  workflow_call:
    secrets:
      api_url:
        required: false
    inputs:
      api_url:
        type: string
        default: /api
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-password
          POSTGRES_DB: quizflow_admin_test
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      PG_HOST: localhost
      PG_PORT: 5432
      PG_DATABASE: quizflow_admin_test
      PG_USER: postgres
      PG_PASSWORD: test-password
      PG_DISABLE_SSL: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: |
            package-lock.json
            yc-functions/package-lock.json
      - run: npm ci
      - run: npm run install:functions
      - run: npm run lint
      - run: npm test
      - run: npm run lint:functions
      - run: npm run test:functions
      - run: npm --prefix yc-functions run test:integration
      - run: npx playwright install --with-deps chromium
      - run: npm run test:landing:e2e
      - run: npm run test:admin:e2e
      - run: npm run build
        env:
          VITE_API_URL: ${{ secrets.api_url || inputs.api_url }}
      - uses: actions/upload-artifact@v4
        with:
          name: frontend-${{ github.sha }}
          path: dist/
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: functions-${{ github.sha }}
          path: yc-functions/dist/
          if-no-files-found: error
