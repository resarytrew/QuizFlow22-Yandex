<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1c1917" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#1c1917" stop-opacity="0" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg)" />

  <!-- Subtle noise dots -->
  <g fill="#1c1917" opacity="0.04">
    <circle cx="120" cy="80" r="2" /><circle cx="360" cy="140" r="1.5" />
    <circle cx="600" cy="60" r="2" /><circle cx="840" cy="180" r="1" />
    <circle cx="1080" cy="100" r="1.5" /><circle cx="200" cy="500" r="2" />
    <circle cx="700" cy="580" r="1.5" /><circle cx="1000" cy="480" r="2" />
  </g>

  <!-- Brand mark -->
  <text x="80" y="240" font-family="Georgia, 'Times New Roman', serif" font-size="88" font-weight="700" fill="#1c1917" letter-spacing="-0.03em">
    Поток
  </text>

  <!-- Divider line -->
  <rect x="80" y="270" width="280" height="4" rx="2" fill="url(#line)" />

  <!-- Tagline -->
  <text x="80" y="340" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="400" fill="#292524">
    конструктор интерактивных сценариев
  </text>

  <!-- Domain -->
  <text x="80" y="440" font-family="system-ui, -apple-system, sans-serif" font-size="24" font-weight="500" fill="#44403c" opacity="0.7">
    Квизы · брифы · подборщики · обучение
  </text>

  <!-- Accent ornament -->
  <g transform="translate(80, 480)">
    <rect width="120" height="2" rx="1" fill="#1c1917" opacity="0.2" />
    <rect x="130" width="40" height="2" rx="1" fill="#1c1917" opacity="0.08" />
  </g>
</svg>
