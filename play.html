<!DOCTYPE html>
<!--
  PLAY_HTML_CSP_FIX_VERSION=2026-06-06-v3
  v3 (2026-06-06): убраны frame-ancestors и report-uri из meta-CSP —
    они работают только в HTTP-заголовках, а из meta игнорируются и
    только засоряли консоль.
  Если вы видите этот комментарий в DevTools → Elements, значит браузер
  загрузил АКТУАЛЬНУЮ версию play.html с расслабленным CSP.
  Если НЕ видите — это кеш: hard refresh (Ctrl+Shift+R) или
  DevTools → Network → Disable cache.
-->
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      CSP notes
      ==========
      * script-src intentionally mirrors QUIZ_CSP in services/quizGenerator.ts.
        play.tsx:46 uses document.write(result.quiz.html) to splice the
        generated quiz into this same document, so the injected <script
        src="cdn..."> tags and the inline engine script are evaluated
        under THIS page's CSP, not the quiz HTML's. If these two policies
        diverge, the strict one wins and the quiz engine silently aborts
        with "Loading the script ... violates script-src 'self'".
      * 'unsafe-inline' is required for the inline engine script.
      * 'unsafe-eval' is required for mathjs/mathjax.
      * The cdn.* host allowlists cover canvas-confetti,
        mathjax (jsdelivr) and gsap/mathjs (cdnjs). The mathjax@3 entry
        is generic on purpose — add a hash on bump.
    -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https:; frame-src 'self' https://rutube.ru https://vk.com https://*.vk.com https://www.youtube.com; worker-src 'self' blob:; object-src 'none'; base-uri 'self'; form-action 'self'">
    <title>Quiz Flow</title>

    <!-- Open Graph / link preview. The values are placeholders that
         play.tsx replaces with the real quiz title/description once the
         quiz is loaded, but link-preview crawlers that don't run JS
         (Telegram, Slack, Discord) see at least something coherent. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Поток" />
    <meta property="og:title" content="Квиз" />
    <meta property="og:description" content="Пройдите интерактивный квиз" />
    <meta property="og:url" content="" id="og-url" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Квиз" />
    <meta name="twitter:description" content="Пройдите интерактивный квиз" />

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Manrope:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f8f9fa;
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
      }
      .loader {
        border: 4px solid #f3f3f3;
        border-top: 4px solid #4f46e5;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 1s linear infinite;
      }
      @keyframes spin {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }
    </style>
</head>
  <body>
    <div id="root">
        <div class="loader"></div>
    </div>
    <script type="module" src="./play.tsx"></script>
  </body>
</html>
